<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  /* 레이아웃: 휴대폰은 한 줄(상대 → 판 → 나 → 버튼), 900px 이상은 판 + 오른쪽 패널. 대담함은 나무판 한 곳에만. */
  --bg: #e6eaf3;
  --surface: #ffffff;
  --ink: #1b2238;
  --muted: #5c6580;
  --line: #cdd4e4;
  --accent: #2b52dc;
  --accent-deep: #1b3aa8;
  --accent-ink: #ffffff;
  --accent-soft: #dde5ff;
  --bubble: #ffffff;
  --btn-edge: #c3cbdd;
  --good: #157f55;
  --bad: #c43d47;
  --mark: #ff5a3c;
  --wood-1: #f2cd8c;
  --wood-2: #dfac62;
  --wood-3: #cc9445;
  --wood-edge: #9c6829;
  --grid: #4a2e10;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10162b; --surface: #1a2240; --ink: #e9edf8; --muted: #9aa4c2; --line: #2c3659;
    --accent: #8aa4ff; --accent-deep: #5674e0; --accent-ink: #0d1430; --accent-soft: #263366;
    --bubble: #222b4d; --btn-edge: #0b1024; --good: #4cc38f; --bad: #ff7d86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10162b; --surface: #1a2240; --ink: #e9edf8; --muted: #9aa4c2; --line: #2c3659;
  --accent: #8aa4ff; --accent-deep: #5674e0; --accent-ink: #0d1430; --accent-soft: #263366;
  --bubble: #222b4d; --btn-edge: #0b1024; --good: #4cc38f; --bad: #ff7d86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }

.app {
  min-height: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 헤더 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { font-family: var(--font-display); font-size: 26px; letter-spacing: -0.5px; line-height: 1; }
.top-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 14px;
  border: 2px solid var(--line); background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:focus-visible, .btn:focus-visible, .board svg:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  font-family: var(--font-display);
  font-size: 17px;
  min-height: 48px;
  padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 14px;
  border: 2px solid var(--btn-edge);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--btn-edge);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s ease, box-shadow .08s ease, background-color .2s;
  white-space: nowrap;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-deep); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.big { width: 100%; min-height: 54px; font-size: 20px; }
.btn.slim { min-height: 44px; font-size: 16px; }

/* 무대 */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }
.board-col {
  width: min(100%, 640px, max(300px, calc(100vh - 290px)));
  width: min(100%, 640px, max(300px, calc(100dvh - 290px)));
  display: flex; flex-direction: column; gap: 10px;
}
.side { width: min(100%, 640px); display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 899px) {
  .side .scorecard { order: -2; }
  .side .actions { order: -1; }
  .status { font-size: 20px; }
}
@media (min-width: 900px) {
  .stage { grid-template-columns: auto 300px; justify-content: center; align-items: center; gap: 36px; }
  .board-col { width: min(640px, max(360px, calc(100vh - 245px))); width: min(640px, max(360px, calc(100dvh - 245px))); }
  .side { width: 300px; }
}

/* 플레이어 줄 */
.pbar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.avatar { width: 52px; height: 52px; flex: none; border-radius: 50%; transition: box-shadow .2s; }
.avatar svg { width: 100%; height: 100%; display: block; }
.pbar.active .avatar, .pbar.active .me-stone { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.pname { font-family: var(--font-display); font-size: 19px; line-height: 1.1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvchip { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; line-height: 1.4; }
.lv0 { background: #d6f1e2; color: #11573a; }
.lv1 { background: #fde6bf; color: #6e4300; }
.lv2 { background: #fddadd; color: #8f1c27; }
.lv3 { background: #e3dcff; color: #3d2a8c; }
.nnbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.nnbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.credit { font-size: 12px; color: var(--muted); margin: 0; }
.credit a { color: inherit; }
.turn-pill { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); visibility: hidden; }
.pbar.active .turn-pill { visibility: visible; }

.bubble {
  position: relative; background: var(--bubble); color: var(--ink);
  padding: 6px 12px; border-radius: 14px; font-size: 14px; line-height: 1.35;
  max-width: 100%; min-height: 31px;
  box-shadow: 0 1px 0 var(--line);
}
.bubble::before {
  content: ""; position: absolute; left: -7px; top: 10px;
  border-style: solid; border-width: 6px 8px 6px 0; border-color: transparent var(--bubble) transparent transparent;
}
.bubble.fresh { animation: bubble-in .28s ease-out; }
@keyframes bubble-in { from { transform: translateY(4px) scale(.97); opacity: .3; } to { transform: none; opacity: 1; } }
.dots { display: inline-flex; gap: 4px; padding: 6px 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

.me-stone { width: 40px; height: 40px; border-radius: 50%; flex: none; margin: 0 6px; transition: box-shadow .2s; }
.me-stone svg { width: 100%; height: 100%; display: block; }
.me-sub { font-size: 13px; color: var(--muted); }

.lid { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; min-width: 52px; }
.lid-dish {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px;
  background: linear-gradient(180deg, #e6b875, #c98f43); box-shadow: inset 0 -2px 0 rgba(90,50,10,.35);
  font-family: var(--font-display); font-size: 17px; color: #3b230b; font-variant-numeric: tabular-nums; min-width: 52px; justify-content: center;
}
.lid-label { font-size: 11px; color: var(--muted); }
.mini { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.mini.b { background: radial-gradient(circle at 35% 30%, #737a90, #15161c 70%); }
.mini.w { background: radial-gradient(circle at 35% 30%, #fff, #d4cfc3 80%); box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

/* 바둑판 */
.board {
  position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 18px;
  background:
    radial-gradient(120% 80% at 18% 8%, rgba(255, 244, 214, .55), transparent 55%),
    repeating-linear-gradient(96deg, rgba(126, 74, 22, .07) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(92deg, rgba(126, 74, 22, .05) 0 1px, transparent 1px 27px),
    linear-gradient(165deg, var(--wood-1), var(--wood-2) 55%, var(--wood-3));
  box-shadow: 0 9px 0 var(--wood-edge), 0 20px 30px rgba(14, 22, 48, .28), inset 0 0 0 2px rgba(255, 255, 255, .28);
  margin-bottom: 9px;
}
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; border-radius: 18px; }
.board.locked svg { cursor: progress; }
.gl { stroke: var(--grid); stroke-width: 1.1; vector-effect: non-scaling-stroke; opacity: .82; }
.gl.edge { stroke-width: 2; opacity: .9; }
.hoshi { fill: var(--grid); }
.sh { fill: rgba(60, 30, 0, .34); }
.wst { stroke: rgba(0, 0, 0, .2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.drop { transform-box: fill-box; transform-origin: center; animation: drop .32s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes drop { 0% { transform: scale(1.3) translateY(-8%); opacity: 0; } 55% { opacity: 1; transform: scale(.95); } 100% { transform: scale(1); } }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s ease-in forwards; }
@keyframes pop { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.35) translateY(-25%); } }
.dead { opacity: .4; }
.lastmark { fill: var(--mark); stroke: rgba(255,255,255,.85); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ghost { opacity: .5; pointer-events: none; }
.cross { stroke: var(--accent-deep); stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: .6; }
.hintring { fill: rgba(43, 82, 220, .18); stroke: #2b52dc; stroke-width: 3; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1.04); } }
.cursor { fill: none; stroke: #2b52dc; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.terr-b { fill: #17181f; }
.terr-w { fill: #fbfaf5; stroke: rgba(0, 0, 0, .45); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* 오른쪽 패널 */
.status { font-family: var(--font-display); font-size: 23px; line-height: 1.2; min-height: 28px; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actions.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.actions[hidden] { display: none; }
@media (max-width: 899px) {
  #actPlay .btn { flex-direction: column; gap: 2px; padding: 6px 4px; min-height: 60px; font-size: 15px; }
}
@media (min-width: 900px) { #actPlay { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scorecard { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.scorecard[hidden] { display: none; }
.scorecard .tot { font-family: var(--font-display); font-size: 20px; text-align: right; }
.scorecard .lead { color: var(--good); }
.tip { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

/* 시트 */
.scrim { position: fixed; inset: 0; background: rgba(9, 13, 30, .5); display: none; align-items: flex-end; justify-content: center; padding: 12px; z-index: 40; }
.scrim.open { display: flex; }
@media (min-width: 640px) { .scrim { align-items: center; } }
.sheet {
  background: var(--surface); color: var(--ink); width: min(500px, 100%);
  max-height: calc(100% - 8px); overflow: auto; border-radius: 26px; padding: 20px 18px 18px;
  box-shadow: 0 24px 60px rgba(5, 10, 30, .35); animation: rise .26s ease-out;
  display: flex; flex-direction: column; gap: 16px;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet:focus { outline: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { font-family: var(--font-display); font-size: 26px; line-height: 1.15; }
.sr { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.opps { display: flex; flex-direction: column; gap: 8px; }
.opp {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px;
  border: 2px solid var(--line); cursor: pointer; transition: border-color .15s, background-color .15s;
}
.opp .avatar { width: 50px; height: 50px; }
.otext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.oname { font-family: var(--font-display); font-size: 19px; display: flex; gap: 8px; align-items: center; }
.odesc { font-size: 13px; color: var(--muted); }
.orec { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
input:checked + .opp { border-color: var(--accent); background: var(--accent-soft); }
input:focus-visible + .opp, input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.flabel { font-family: var(--font-display); font-size: 17px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg label {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px; border-radius: 14px;
  border: 2px solid var(--line); cursor: pointer; text-align: center; transition: border-color .15s, background-color .15s;
}
.seg label b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.seg label small { font-size: 12px; color: var(--muted); }
.seg input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.fine { font-size: 12px; color: var(--muted); margin: -4px 0 0; text-align: center; }

.result-hero { display: flex; align-items: center; gap: 14px; }
.result-hero .avatar { width: 64px; height: 64px; }
.result-title { font-family: var(--font-display); font-size: 32px; line-height: 1.1; }
.result-title.win { color: var(--good); }
.result-sub { color: var(--muted); font-size: 14px; }
.rtable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.rtable th, .rtable td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.rtable th:first-child, .rtable td:first-child { text-align: left; }
.rtable th { font-weight: 600; color: var(--muted); font-size: 12px; }
.rtable td.sum { font-family: var(--font-display); font-size: 18px; }
.rquote { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <radialGradient id="lgB" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#727a92"/><stop offset=".45" stop-color="#262a35"/><stop offset="1" stop-color="#090a0e"/></radialGradient>
          <radialGradient id="lgW" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#efebe2"/><stop offset="1" stop-color="#c6c0b2"/></radialGradient>
        </defs>
        <circle cx="25" cy="23" r="12" fill="url(#lgW)" stroke="rgba(0,0,0,.2)"/>
        <circle cx="15" cy="16" r="12" fill="url(#lgB)"/>
      </svg>
      <h1>바둑 한 판</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="소리 끄기"></button>
      <button class="btn slim" id="btnNew" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 게임
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="board-col" aria-label="대국">
      <div class="pbar" id="oppBar">
        <div class="avatar" id="oppAvatar"></div>
        <div class="pinfo">
          <div class="pname"><span id="oppName">몽이</span><span class="lvchip lv1" id="oppLv">중</span><span class="turn-pill">차례</span></div>
          <div class="bubble" id="oppBubble" aria-live="polite">한 판 해 볼까요?</div>
        </div>
        <div class="lid" title="상대가 잡은 돌">
          <div class="lid-dish"><span class="mini b" id="oppCapStone"></span><span id="oppCaps">0</span></div>
          <span class="lid-label">따낸 돌</span>
        </div>
      </div>

      <div class="board" id="board">
        <svg id="svg" viewBox="0 0 960 960" tabindex="0" aria-label="바둑판. 방향키로 움직이고 Enter로 둡니다.">
          <defs>
            <radialGradient id="gB" cx="36%" cy="30%" r="72%"><stop offset="0" stop-color="#6f768c"/><stop offset=".38" stop-color="#282b36"/><stop offset="1" stop-color="#08090d"/></radialGradient>
            <radialGradient id="gW" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#f1eee6"/><stop offset="1" stop-color="#c7c1b3"/></radialGradient>
          </defs>
          <g id="gGrid"></g>
          <g id="gStones"></g>
          <g id="gTerr"></g>
          <g id="gFx"></g>
          <g id="gMarks"></g>
        </svg>
      </div>

      <div class="pbar" id="meBar">
        <div class="me-stone" id="meStone"></div>
        <div class="pinfo">
          <div class="pname"><span>나</span><span class="turn-pill">차례</span></div>
          <div class="me-sub" id="meSub">흑 · 먼저 둬요</div>
        </div>
        <div class="lid" title="내가 잡은 돌">
          <div class="lid-dish"><span class="mini w" id="meCapStone"></span><span id="meCaps">0</span></div>
          <span class="lid-label">따낸 돌</span>
        </div>
      </div>
    </section>

    <aside class="side">
      <div>
        <div class="status" id="status" aria-live="polite">새 게임을 골라 주세요</div>
        <div class="meta" id="meta">9×9 · 덤 6.5</div>
      </div>
      <div class="scorecard" id="scorecard" hidden></div>
      <div class="actions" id="actPlay">
        <button class="btn" id="btnUndo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>무르기</button>

    G.moves.push(p); G.hint = -1; G.pending = -1;
    const caps = [];
    if (k) for (let i = 0; i < b.len; i++) if (before[i] === 3 - col && b.c[i] === EMPTY) caps.push({ p: i, v: 3 - col });
    renderAll(p); captureFx(caps);
    Sound.stone(); if (k) setTimeout(() => Sound.capture(k), 110);
    return k;
  }

  function onBoardTap(p, ptype) {
    if (p < 0) return;
    if (G.phase === 'scoring') {
      if (G.busy || !G.dead) return;
      const v = G.board.c[p];
      if (v !== BLACK && v !== WHITE) return;
      const grp = G.board.groupStones(p), nv = G.dead[p] ? 0 : 1;
      for (const s of grp) G.dead[s] = nv;
      G.score = finalScore(G.board, G.dead, KOMI);
      Sound.stone(0.5); renderAll(); save();
      return;
    }
    if (G.phase !== 'play') return;
    if (G.busy) { if (G.thinking) toast(`${iga(CHAR[G.level].name)} 생각 중이에요. 잠깐만요!`); return; }
    if (G.board.turn !== G.user) return;
    const code = G.board.legality(p, G.user);
    if (code === 1) return;
    if (code === 2) { toast('패예요. 방금 따낸 자리는 바로 되따낼 수 없어요. 다른 곳에 한 수 두고 오세요.'); return; }
    if (code === 3) { toast('돌이 놓자마자 잡히는 자리라서 둘 수 없어요.'); return; }
    const confirmTap = (ptype === 'touch' || ptype === 'pen') && G.size >= 13;
    if (confirmTap && G.pending !== p) { G.pending = p; renderMarks(); updateHUD(); return; }
    userMove(p);
  }
  function userMove(p) {
    const k = applyMove(p, G.user);
    if (k) say(pick(CHAR[G.level].capUser));
    save();
    aiTurn(false);
  }
  function userPass() {
    if (!userCanPlay()) return;
    const aiPassed = G.board.passes >= 1;
    G.board.pass(); G.moves.push(PASS); G.hint = -1; G.pending = -1;
    Sound.pass();
    if (aiPassed) { startScoring(); return; }
    toast('패스했어요');
    renderAll(); save();
    aiTurn(true);
  }

  let proFallbackNoted = false;
  async function proDecide(userPassed, token) {
    if (NNPool.state !== 'ready') {
      const off = NNPool.on((pl) => {
        if (token === G.token && pl.state === 'loading') el.oppBubble.textContent = `신경망 불러오는 중… ${Math.round(pl.progress * 100)}%`;
      });
      el.oppBubble.textContent = '신경망 불러오는 중…';
      await NNPool.load(); off();
      if (token !== G.token) return { cancelled: true };
      sayThinking();
    }
    const fallback = () => {
      if (!proFallbackNoted) { proFallbackNoted = true; toast(`프로 AI를 쓸 수 없어서 상 난이도로 둬요. (${NNPool.error || '오류'})`); }
      return decideAI(G.board, 2, userPassed, () => token !== G.token, poolSearch);
    };
    if (NNPool.state !== 'ready') return fallback();
    const n = G.size;
    let r;
    try { r = await ProAI.search(n, G.moves.slice(), { komi: KOMI, timeMs: PRO.time[n], maxVisits: PRO.visits[n], cancel: () => token !== G.token }); }
    catch (e) { console.error(e); return fallback(); }
    G.aiWinrate = r.winrate;
    if (r.winrate < 0.03 && G.board.moveNum > n * n * 0.3) { if (++G.proLow >= 2) return { resign: true }; }
    else G.proLow = 0;
    return { move: r.move, sims: r.visits, winrate: r.winrate };
  }

  async function aiTurn(userPassed) {
    const token = G.token, ch = CHAR[G.level];
    G.busy = true; G.thinking = true; G.pending = -1;
    sayThinking(); renderMarks(); updateHUD();
    await sleep(40);
    if (token !== G.token) return;
    const t0 = performance.now();
    let d;
    try { d = G.level === 3 ? await proDecide(userPassed, token) : await decideAI(G.board, G.level, userPassed, () => token !== G.token, poolSearch); }
    catch (e) { console.error(e); d = { move: PASS }; }
    if (d.cancelled) return;
    const wait = 520 - (performance.now() - t0);
    if (wait > 0) await sleep(wait);
    if (token !== G.token) return;
    G.busy = false; G.thinking = false;
    if (d.sims) G.lastSims = d.sims;
    if (d.resign) {
      say(pick(ch.resign));
      finishGame({ winner: G.user, by: 'resign', resigner: G.ai });
      return;
    }
    if (d.move === PASS || !G.board.isLegal(d.move, G.ai)) {
      G.board.pass(); G.moves.push(PASS); Sound.pass();
      say(pick(ch.pass));
      if (G.board.passes >= 2) { startScoring(); return; }
      renderAll(); save();
      return;
    }
    const k = applyMove(d.move, G.ai);
    if (k) say(pick(ch.capAI));
    else if (userPassed) say(pick(ch.keepGoing));
    else say(pick(ch.move));
    save();
  }

  async function startScoring() {
    const token = ++G.token;
    G.phase = 'scoring'; G.busy = true; G.thinking = false; G.hinting = false; G.hint = -1; G.pending = -1;
    G.dead = null; G.score = null;
    renderAll();
    const n = G.size;
    let own = null;
    if (NNPool.state === 'ready') { try { own = await ProAI.ownership(n, G.moves.slice(), KOMI); } catch (e) { own = null; } }
    if (!own) own = await estimateOwnership(G.board, n === 9 ? 500 : n === 13 ? 350 : 250, 2500, () => token !== G.token);
    if (token !== G.token) return;
    G.dead = deadFromOwnership(G.board, own);
    G.score = finalScore(G.board, G.dead, KOMI);
    G.busy = false;
    renderAll(); save();
  }
  function resumePlay() {
    G.token++;
    Object.assign(G, { phase: 'play', busy: false, dead: null, score: null });
    G.board.passes = 0;
    renderAll(); save();
    say(pick(CHAR[G.level].keepGoing));
    if (G.board.turn === G.ai) aiTurn(false);
  }

  function finishGame(res) {
    G.token++;
    Object.assign(G, { busy: false, thinking: false, hinting: false, phase: 'over', result: res, hint: -1, pending: -1 });
    const key = LEVELS[G.level].key;
    const rec = stats[key] || { w: 0, l: 0 };
    if (res.winner === G.user) rec.w++; else rec.l++;
    stats[key] = rec; store.set(STATS_KEY, stats);
    store.del(STORE_KEY);
    const ch = CHAR[G.level];
    if (res.by === 'score') say(res.winner === G.user ? pick(ch.aiLose) : pick(ch.aiWin));
    if (res.winner === G.user) Sound.win(); else Sound.lose();
    renderAll();
    setTimeout(openResult, res.by === 'resign' ? 450 : 200);
  }

  function openResult() {
    const r = G.result; if (!r) return;
    const ch = CHAR[G.level], won = r.winner === G.user;
    $('#resAvatar').innerHTML = avatarSVG(G.level, G.ai);
    const title = $('#resultTitle');
    title.textContent = won ? '이겼어요!' : '아쉽게 졌어요';
    title.classList.toggle('win', won);
    let sub = '', body = '';
    if (r.by === 'resign') {
      sub = r.resigner === G.ai ? `${iga(ch.name)} 기권했어요 · ${colorName(G.user)} 불계승` : `내가 기권했어요 · ${colorName(G.ai)} 불계승`;
    } else {
      const s = G.score, m = Math.abs(s.diff);
      sub = `${colorName(r.winner)} ${fmt(m)}집 승 · ${G.size}×${G.size}`;
      const who = (c) => (c === G.user ? '나' : ch.name);
      body = `<table class="rtable"><thead><tr><th></th><th>살아 있는 돌</th><th>집</th><th>덤</th><th>합계</th></tr></thead><tbody>` +
        `<tr><td><span class="mini b"></span> 흑 (${who(BLACK)})</td><td>${s.bS}</td><td>${s.bT}</td><td>–</td><td class="sum">${fmt(s.black)}</td></tr>` +
        `<tr><td><span class="mini w"></span> 백 (${who(WHITE)})</td><td>${s.wS}</td><td>${s.wT}</td><td>${s.komi}</td><td class="sum">${fmt(s.white)}</td></tr>` +
        `</tbody></table>`;
    }
    const rec = stats[LEVELS[G.level].key] || { w: 0, l: 0 };
    $('#resultSub').textContent = sub;
    $('#resultBody').innerHTML = body + `<p class="result-sub" style="margin:10px 0 0">${ch.name} 상대 전적 ${rec.w}승 ${rec.l}패${G.hints ? ` · 이번 판 힌트 ${G.hints}번` : ''}</p>`;
    const line = r.by === 'resign' && r.resigner === G.ai ? pick(ch.resign) : won ? pick(ch.aiLose) : pick(ch.aiWin);
    $('#resultQuote').textContent = `${ch.name}: “${line}”`;
    openScrim('resultScrim');
  }

  function undo() {
    if (G.phase !== 'play' || !hasUserMove() || G.hinting) return;
    G.token++;
    G.busy = false; G.thinking = false;
    while (G.moves.length) {
      const col = (G.moves.length - 1) % 2 === 0 ? BLACK : WHITE;
      G.moves.pop();
      if (col === G.user) break;
    }
    rebuild();
    G.hint = -1; G.pending = -1;
    renderAll(); save();
    say(pick(CHAR[G.level].undo));
  }

  async function showHint() {
    if (!userCanPlay()) return;
    const token = G.token;
    G.busy = true; G.hinting = true; updateHUD();
    let res;
    if (NNPool.state === 'ready') {
      try { res = await ProAI.search(G.size, G.moves.slice(), { komi: KOMI, timeMs: 1500, maxVisits: 300, cancel: () => token !== G.token }); }
      catch (e) { res = null; }
    }
    if (!res) res = await Pool.search(G.board.clone(), { timeMs: 1200, maxSims: 8000, komi: KOMI, cancel: () => token !== G.token });
    if (token !== G.token) return;
    G.busy = false; G.hinting = false;
    if (res.move === PASS) { toast('둘 만한 곳이 없어요. 패스해도 좋아요.'); updateHUD(); return; }
    G.hint = res.move; G.hints++;
    say(pick(CHAR[G.level].hint));
    renderMarks(); updateHUD(); save();
  }

  // ---- 시트 ----
  let lastFocus = null;
  function openScrim(id) {
    lastFocus = document.activeElement;
    const s = $('#' + id); s.classList.add('open');
    const sheet = s.querySelector('.sheet');
    if (sheet) setTimeout(() => sheet.focus({ preventScroll: true }), 30);
  }
  function closeScrim(id) {
    $('#' + id).classList.remove('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function aiColorForPref(c) { return c === 'white' ? BLACK : WHITE; }
  function buildSetup() {
    const list = $('#oppList'); let h = '';
    const aiC = aiColorForPref(currentColorChoice());
    CHAR.forEach((ch, i) => {
      const rec = stats[LEVELS[i].key];
      h += `<input class="sr" type="radio" name="opp" id="opp${i}" value="${i}"${i === prefs.level ? ' checked' : ''}>` +
        `<label class="opp" for="opp${i}"><span class="avatar">${avatarSVG(i, aiC)}</span><span class="otext">` +
        `<span class="oname">${ch.name}<span class="lvchip lv${i}">${ch.lv} · ${ch.title}</span></span>` +
        `<span class="odesc">${ch.desc}</span>` +
        `<span class="orec">${rec ? `전적 ${rec.w}승 ${rec.l}패` : '아직 대국 기록이 없어요'}</span>` +
        (i === 3 ? `<span class="orec" id="proNote"></span><span class="nnbar" id="proBar" hidden><i></i></span>` : '') +
        `</span></label>`;
    });
    list.innerHTML = h;
    updateProNote();
    const pr = document.getElementById('opp3');
    if (pr) pr.addEventListener('change', () => { if (pr.checked) NNPool.load(); });
  }
  function updateProNote() {
    const note = document.getElementById('proNote'), bar = document.getElementById('proBar');
    if (!note) return;
    const st = NNPool.state;
    note.textContent = st === 'loading' ? `신경망 받는 중… ${Math.round(NNPool.progress * 100)}%`
      : st === 'ready' ? `신경망 준비 완료 · 계산 일꾼 ${NNPool.workers.length}개`
      : st === 'failed' ? `이 기기에서는 쓸 수 없어요: ${NNPool.error}`
      : '처음 한 번 신경망(약 6MB)을 내려받아요.';
    bar.hidden = st !== 'loading';
    bar.firstChild.style.width = `${Math.round(NNPool.progress * 100)}%`;
  }
  function currentColorChoice() { const c = document.querySelector('input[name="color"]:checked'); return c ? c.value : prefs.color; }
  function openSetup() {
    const sz = document.getElementById('size' + prefs.size); if (sz) sz.checked = true;
    const cl = document.getElementById(prefs.color === 'white' ? 'colW' : prefs.color === 'random' ? 'colR' : 'colB'); if (cl) cl.checked = true;
    buildSetup();
    $('#setupClose').hidden = !(G.phase === 'play' || G.phase === 'scoring' || G.phase === 'over');
    $('#btnStart').textContent = G.phase === 'play' ? '이 판 접고 새로 시작' : '대국 시작';
    openScrim('setupScrim');
  }
  function startFromSetup() {
    const lv = +(document.querySelector('input[name="opp"]:checked') || { value: 1 }).value;
    const size = +(document.querySelector('input[name="size"]:checked') || { value: 9 }).value;
    const color = currentColorChoice();
    Object.assign(prefs, { level: lv, size, color });
    store.set(PREF_KEY, prefs);
    closeScrim('setupScrim');
    newGame({ size, level: lv, color });
  }

  // ---- 입력 ----
  let lastPtr = 'mouse';
  function evPoint(e) {
    const r = el.svg.getBoundingClientRect(), V = vbSize();
    const vx = ((e.clientX - r.left) / r.width) * V, vy = ((e.clientY - r.top) / r.height) * V;
    const x = Math.round((vx - CM) / CS), y = Math.round((vy - CM) / CS);
    if (x < 0 || y < 0 || x >= G.size || y >= G.size) return -1;
    return G.board.pt(x, y);
  }
  el.svg.addEventListener('pointerdown', (e) => { lastPtr = e.pointerType || 'mouse'; Sound.ensure(); });
  el.svg.addEventListener('click', (e) => { G.cursor = -1; onBoardTap(evPoint(e), lastPtr); });
  el.svg.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const p = evPoint(e);
    if (p !== G.hover) { G.hover = p; renderMarks(); }
  });
  el.svg.addEventListener('pointerleave', () => { if (G.hover >= 0) { G.hover = -1; renderMarks(); } });
  el.svg.addEventListener('focus', () => { if (G.cursor < 0) G.cursor = G.board.pt((G.size - 1) >> 1, (G.size - 1) >> 1); });
  el.svg.addEventListener('blur', () => renderMarks());
  el.svg.addEventListener('keydown', (e) => {
    const k = e.key; let dx = 0, dy = 0;
    if (k === 'ArrowLeft') dx = -1; else if (k === 'ArrowRight') dx = 1; else if (k === 'ArrowUp') dy = -1; else if (k === 'ArrowDown') dy = 1;
    if (G.cursor < 0) G.cursor = G.board.pt((G.size - 1) >> 1, (G.size - 1) >> 1);
    if (dx || dy) {
      e.preventDefault();
      const x = Math.max(0, Math.min(G.size - 1, G.board.xOf(G.cursor) + dx)), y = Math.max(0, Math.min(G.size - 1, G.board.yOf(G.cursor) + dy));
      G.cursor = G.board.pt(x, y); G.hover = G.cursor; renderMarks();
    } else if (k === 'Enter' || k === ' ') {
      e.preventDefault(); Sound.ensure(); onBoardTap(G.cursor, 'keyboard');
    }
  });
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });

  el.btnUndo.addEventListener('click', undo);
  el.btnHint.addEventListener('click', showHint);
  el.btnPass.addEventListener('click', userPass);
  el.btnResign.addEventListener('click', () => {
    if (G.phase !== 'play') return;
    $('#confirmText').textContent = `${CHAR[G.level].name} 상대 전적에 패배로 기록돼요.`;
    openScrim('confirmScrim');
  });
  $('#confirmNo').addEventListener('click', () => closeScrim('confirmScrim'));
  $('#confirmYes').addEventListener('click', () => {
    closeScrim('confirmScrim');
    if (G.phase !== 'play') return;
    say(pick(CHAR[G.level].aiWin));
    finishGame({ winner: G.ai, by: 'resign', resigner: G.user });
  });
  $('#btnNew').addEventListener('click', openSetup);
  $('#setupClose').addEventListener('click', () => closeScrim('setupScrim'));
  $('#btnStart').addEventListener('click', startFromSetup);
  document.querySelectorAll('input[name="color"]').forEach((r) => r.addEventListener('change', buildSetupKeepSel));
  function buildSetupKeepSel() {
    const cur = document.querySelector('input[name="opp"]:checked');
    const keep = cur ? +cur.value : prefs.level; const old = prefs.level; prefs.level = keep; buildSetup(); prefs.level = old;
  }
  $('#btnResume').addEventListener('click', resumePlay);
  $('#btnFinish').addEventListener('click', () => {
    if (!G.score) return;
    finishGame({ winner: G.score.diff > 0 ? BLACK : WHITE, by: 'score' });
  });
  $('#btnAgain').addEventListener('click', () => newGame({ size: prefs.size, level: prefs.level, color: prefs.color }));
  $('#btnShowResult').addEventListener('click', openResult);
  $('#resultClose').addEventListener('click', () => closeScrim('resultScrim'));
  $('#resAgain').addEventListener('click', () => { closeScrim('resultScrim'); newGame({ size: prefs.size, level: prefs.level, color: prefs.color }); });
  $('#resSetup').addEventListener('click', () => { closeScrim('resultScrim'); openSetup(); });
  el.btnSound.addEventListener('click', () => {
    Sound.on = !Sound.on; prefs.sound = Sound.on; store.set(PREF_KEY, prefs);
    renderSoundBtn(); if (Sound.on) { Sound.ensure(); Sound.stone(0.6); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('#confirmScrim').classList.contains('open')) closeScrim('confirmScrim');
    else if ($('#resultScrim').classList.contains('open')) closeScrim('resultScrim');
    else if ($('#setupScrim').classList.contains('open') && !$('#setupClose').hidden) closeScrim('setupScrim');
  });
  document.querySelectorAll('.scrim').forEach((s) => s.addEventListener('click', (e) => {
    if (e.target !== s) return;
    if (s.id === 'setupScrim' && $('#setupClose').hidden) return;
    closeScrim(s.id);
  }));

  // ---- 시작 ----
  function restore(s) {
    if (!s || ![9, 13, 19].includes(s.size) || ![0, 1, 2, 3].includes(s.level) || ![BLACK, WHITE].includes(s.user) || !Array.isArray(s.moves)) return false;
    G.size = s.size; G.level = s.level; G.user = s.user; G.ai = 3 - s.user; G.hints = s.hints || 0;
    G.moves = s.moves.filter((m) => Number.isInteger(m));
    rebuild();
    ProAI.resetTree();
    if (G.level === 3) NNPool.load();
    G.phase = 'play';
    setupGrid(); renderPlayers(); renderAll();
    say('이어서 둬요!');
    if (s.phase === 'scoring') startScoring();
    else if (G.board.turn === G.ai) aiTurn(G.moves.length > 0 && G.moves[G.moves.length - 1] === PASS);
    return true;
  }
  function start(data) {
    renderSoundBtn();
    Pool.init();
    const saved = data && data.moves ? data : store.get(STORE_KEY);
    let ok = false;
    if (saved && (saved.phase === 'play' || saved.phase === 'scoring')) {
      try { ok = restore(saved); } catch (e) { console.error(e); ok = false; }
    }
    if (!ok) {
      G.size = prefs.size; G.level = prefs.level; G.user = prefs.color === 'white' ? WHITE : BLACK; G.ai = 3 - G.user;
      G.board = new Board(G.size); G.phase = 'setup';
      setupGrid(); renderPlayers(); renderAll();
      say(pick(CHAR[G.level].greet));
      openSetup();
    }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
